# 글쓰기 관리자(Sveltia CMS) 설정
# 문서: https://sveltiacms.app/en/docs/start
#
# 로그인: /admin 에서 "Sign In with Token"을 누르고 GitHub 토큰을 붙여 넣습니다.
#   토큰 만들기: GitHub → Settings → Developer settings → Fine-grained tokens
#   이 저장소만 선택하고 권한은 Contents: Read and write
# 글을 발행하면 main 브랜치에 커밋되고, GitHub Actions가 자동으로 배포합니다.

backend:
  name: github
  repo: AIP-1/blog-basic-AIGJ_01-001-firstblog
  branch: main
  commit_messages:
    create: '새 글: {{slug}}'
    update: '글 수정: {{slug}}'
    delete: '글 삭제: {{slug}}'
    uploadMedia: '이미지 업로드: {{path}}'
    deleteMedia: '이미지 삭제: {{path}}'

# 업로드한 그림이 저장되는 기본 위치 (썸네일 등 public 폴더용)
media_folder: public/images/posts
public_folder: /images/posts

output:
  # 비워 둔 선택 항목은 파일에 적지 않습니다 (Astro 글 형식 검사 통과용)
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: 글
    label_singular: 글
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    # 본문에 넣은 그림은 src/assets/blog 에 저장하고 글 파일 기준 상대 경로로 적습니다.
    # Astro가 빌드할 때 자동으로 용량을 줄이고, GitHub Pages 하위 경로도 알아서 붙여 줘요.
    media_folder: ../../assets/blog
    public_folder: ../../assets/blog
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} · {{category}}'
    sortable_fields: [pubDate, title, category]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 요약, name: description, widget: string, hint: '글 목록과 공유 미리보기에 나오는 한두 줄 소개' }
      - label: 발행일
        name: pubDate
        widget: datetime
        hint: '미래 시간을 고르면 예약 발행돼요 (매시 정각에 공개)'
      - label: 카테고리
        name: category
        widget: string
        default: 일상
        hint: "'/'로 나누면 하위 카테고리가 돼요. 예: 개발/Astro"
      - { label: 태그, name: tags, widget: list, required: false, hint: '쉼표로 구분' }
      # 썸네일은 public/images/posts 에 저장 ('/'로 시작하는 경로, 사이트가 base 경로를 붙여 줌)
      - { label: 썸네일, name: image, widget: image, required: false, media_folder: /public/images/posts, public_folder: /images/posts }
      - { label: 수정일, name: updatedDate, widget: datetime, required: false }
      - { label: 초안, name: draft, widget: boolean, default: false, required: false, hint: '켜 두면 사이트에 공개되지 않아요' }
      - { label: 본문, name: body, widget: markdown }
