# main 브랜치에 푸시하면 빌드해서 GitHub Pages에 배포합니다.
# 예약 발행 글이 제때 공개되도록 매시 정각에도 다시 빌드합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 저장소 이름에 따라 주소의 base 경로를 정합니다.
      #   아이디.github.io  → https://아이디.github.io/
      #   그 외(예: blog)   → https://아이디.github.io/blog/
      - name: Set site and base path
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
